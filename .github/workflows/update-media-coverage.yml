name: Update media coverage

on:
  push:
    paths:
      - '.github/workflows/update-media-coverage.yml'

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply site update
        run: python scripts/update_media_coverage.py

      - name: Commit site update
        run: |
          if git diff --quiet -- public/index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git commit -m "feat: ampliar cobertura da imprensa e corrigir acesso ao processo"
          git push
