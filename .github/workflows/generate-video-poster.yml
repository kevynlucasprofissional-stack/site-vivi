name: Generate video poster

on:
  push:
    branches:
      - video-repercussao-update
    paths:
      - '.github/workflows/generate-video-poster.yml'

permissions:
  contents: write

jobs:
  poster:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate poster frame
        run: |
          ffmpeg -y -ss 00:00:05 -i "public/assets/Cortes da operação Simulatio.mp4" -frames:v 1 -q:v 2 "public/assets/cortes-simulatio-poster.jpg"

      - name: Commit poster
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "public/assets/cortes-simulatio-poster.jpg"
          git diff --cached --quiet && exit 0
          git commit -m "chore: gerar thumbnail do vídeo"
          git push
