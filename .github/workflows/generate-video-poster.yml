name: Optimize video and generate poster

on:
  push:
    branches:
      - video-repercussao-update
    paths:
      - '.github/workflows/generate-video-poster.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Optimize video for Cloudflare Pages
        shell: bash
        run: |
          set -euo pipefail
          INPUT="public/assets/Cortes da operação Simulatio.mp4"
          OUTPUT="public/assets/cortes-operacao-simulatio.mp4"
          POSTER="public/assets/cortes-simulatio-poster.jpg"
          DURATION="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$INPUT")"
          BITRATES="$(python3 -c 'import sys; s=max(float(sys.argv[1]),1.0); total=int(23*1024*1024*8/s*0.96); a=96000; v=total-a; a,v=(64000,max(80000,total-64000)) if v<120000 else (a,v); print(v,a)' "$DURATION")"
          read -r VBIT ABIT <<< "$BITRATES"
          echo "Duration: ${DURATION}s"
          echo "Target video bitrate: ${VBIT} bps"
          echo "Target audio bitrate: ${ABIT} bps"
          ffmpeg -y -i "$INPUT" -vf "scale='min(1280,iw)':-2" -c:v libx264 -preset medium -b:v "$VBIT" -pass 1 -an -f mp4 /dev/null
          ffmpeg -y -i "$INPUT" -vf "scale='min(1280,iw)':-2" -c:v libx264 -preset medium -b:v "$VBIT" -pass 2 -c:a aac -b:a "$ABIT" -movflags +faststart "$OUTPUT"
          ffmpeg -y -ss 00:00:05 -i "$OUTPUT" -frames:v 1 -q:v 2 "$POSTER"
          SIZE="$(stat -c%s "$OUTPUT")"
          LIMIT=$((25 * 1024 * 1024))
          echo "Optimized size: ${SIZE} bytes"
          test "$SIZE" -lt "$LIMIT"
          rm -f ffmpeg2pass-0.log ffmpeg2pass-0.log.mbtree
          git rm "$INPUT"

      - name: Commit optimized media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "public/assets/cortes-operacao-simulatio.mp4" "public/assets/cortes-simulatio-poster.jpg"
          git commit -m "feat: otimizar vídeo da Operação Simulatio para web"
          git pull --rebase origin video-repercussao-update
          git push origin HEAD:video-repercussao-update
