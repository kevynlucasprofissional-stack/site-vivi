<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>Faça sua denúncia | Rio Verde Merece Saber</title>
  <link rel="stylesheet" href="/features.css">
</head>
<body style="background:#f8f7f4;margin:0">
  <main class="rv-shell">
    <header class="rv-top"><h1>Faça sua denúncia</h1></header>
    <section class="rv-panel" style="max-width:720px;margin:auto">
      <form id="report-form" class="rv-form">
        <label for="report-message">Descreva sua denúncia</label>
        <textarea id="report-message" name="message" required minlength="15" maxlength="8000"></textarea>
        <div id="report-status" role="status" aria-live="polite"></div>
        <button class="rv-btn" type="submit">Enviar denúncia</button>
      </form>
      <div id="report-done" class="rv-success rv-hidden" role="status">
        <h2>Denúncia enviada com sucesso</h2>
        <p>Protocolo: <strong id="protocol"></strong></p>
      </div>
    </section>
  </main>
  <script defer src="/denuncia.js?v=20261019-anon"></script>
</body>
</html>
